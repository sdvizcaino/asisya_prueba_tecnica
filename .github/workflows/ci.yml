name: CI

# Corre en cada push a main. No incluye test:evidencia-falla ni
# test:perf:degradado: están diseñados para fallar (son evidencia de las
# Secciones C y D) y romperían el pipeline si se ejecutaran aquí.
on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar Chromium de Playwright
        run: npx playwright install --with-deps chromium

      - name: Sección B1 — pruebas E2E (frontend)
        run: npm run test:e2e

      - name: Sección B2 — pruebas de API (Postman/Newman)
        run: npm run test:api

      - name: Levantar el sandbox para la prueba de carga
        run: |
          npm run start &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/health && break
            sleep 1
          done

      - name: Sección D — prueba de carga con k6 (Docker)
        run: npm run test:perf:docker

      - name: Detener el sandbox
        if: always()
        run: pkill -f "node mock/server.js" || true

      - name: Subir reporte de Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Subir reporte de Newman
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-report
          path: tests/api/reports/
          retention-days: 30

      - name: Subir reportes de k6
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-reports
          path: perf/reports/
          retention-days: 30
